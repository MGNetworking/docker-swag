# Reverse proxy de production : SWAG (Nginx + Certbot, image linuxserver/swag) avec les sites de ce dépôt.
# SWAG obtient et renouvelle seul le certificat Let's Encrypt (validation HTTP) ; les autres projets du serveur
# rejoignent le réseau « proxy » et sont joints par le nom de leur conteneur. Mode d'emploi : README.md

name: proxy

services:

  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Europe/Paris}
      URL: ${URL:?URL manquant, copier .env.example en .env}
      SUBDOMAINS: ${SUBDOMAINS:-}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
      ONLY_SUBDOMAINS: ${ONLY_SUBDOMAINS:-false}
      EMAIL: ${EMAIL:?EMAIL manquant, copier .env.example en .env}
      VALIDATION: http
      STAGING: ${STAGING:-false}
    volumes:
      - swag_config:/config                                                  # état de SWAG : certificats, journaux
      - ./nginx/site-confs/default.conf:/config/nginx/site-confs/default.conf:ro
      - ./nginx/snippets:/config/nginx/snippets:ro
      - ./nginx/sites:/config/nginx/sites:ro
      - ./html:/config/nginx/html:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /run/nginx.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  swag_config:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
