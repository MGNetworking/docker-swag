# Remplace le default.conf de SWAG. Chargé par SWAG au niveau « http » : réglages communs, serveurs par défaut,
# puis les sites de CE serveur (nginx/sites/*.conf).

# En-têtes volumineux (cookies de Keycloak, jetons) : le défaut de 8k provoque des erreurs 400.
large_client_header_buffers 4 16k;
# Taille des envois : SWAG la règle déjà (client_max_body_size 0 dans son nginx.conf) ; un site peut la fixer lui-même.

# Le résolveur de SWAG (resolver.conf) est celui de Docker : les noms de conteneurs sont résolus à la requête.
# Les sites utilisent une variable dans proxy_pass : un projet arrêté n'empêche donc pas Nginx de démarrer (502 seulement).

# Port 80 : redirection vers HTTPS. Pas de défi Let's Encrypt ici : en validation HTTP, SWAG arrête Nginx
# quelques secondes pendant le renouvellement et répond lui-même au défi.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 : un nom inconnu (ou l'adresse IP seule) est refusé dès la poignée de main TLS, sans certificat :
# le serveur ne révèle ni le nom ni le contenu d'aucun site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

include /config/nginx/sites/*.conf;
