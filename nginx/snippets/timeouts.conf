# Délais par défaut d'un service ordinaire : à inclure dans un bloc location, avec proxy.conf.
# Un site qui a besoin d'autres valeurs (lecture vidéo, consoles de machines virtuelles) ne l'inclut pas et les écrit lui-même :
# Nginx refuse une même directive écrite deux fois dans un même bloc.
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
