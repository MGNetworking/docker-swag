# __DOMAIN__ -> https://__UPSTREAM__
# Service qui parle lui-même HTTPS avec un certificat auto-signé ou interne (interface d'équipement, conteneur en HTTPS).
# Le certificat du service n'est pas vérifié : à réserver à un saut sur un réseau de confiance.
# Généré par scripts/new-site.sh d'après nginx/templates/app-https.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/errors.conf;

    location / {
        set $upstream __UPSTREAM__;
        include /config/nginx/snippets/proxy.conf;
        include /config/nginx/snippets/timeouts.conf;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }
}
