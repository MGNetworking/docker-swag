# __DOMAIN__ -> http://__UPSTREAM__
# Application web quelconque qui parle HTTP (site, API, interface) ; le WebSocket est géré.
# Généré par scripts/new-site.sh d'après nginx/templates/app.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/errors.conf;

    location / {
        # Variable : le nom du conteneur est résolu à la requête (voir site-confs/default.conf), pas au démarrage de Nginx.
        set $upstream __UPSTREAM__;
        include /config/nginx/snippets/proxy.conf;
        include /config/nginx/snippets/timeouts.conf;
        proxy_pass http://$upstream;
    }
}
