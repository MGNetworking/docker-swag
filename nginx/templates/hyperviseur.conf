# __DOMAIN__ -> https://__UPSTREAM__   (hyperviseur : VMware ESXi, interface web et consoles de machines virtuelles)
# L'hyperviseur parle HTTPS avec un certificat auto-signé (non vérifié) et utilise le WebSocket pour les consoles.
# Il n'est pas sur le serveur : l'adresse doit être joignable depuis ce serveur (VPN, réseau privé).
# Interface d'administration : la protéger davantage (restriction d'adresses, authentification) avant de l'exposer.
# Généré par scripts/new-site.sh d'après nginx/templates/hyperviseur.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/errors.conf;

    # Envois de gros fichiers (images ISO, disques) et consoles ouvertes longtemps.
    client_max_body_size 0;

    location / {
        set $upstream __UPSTREAM__;
        include /config/nginx/snippets/proxy.conf;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_session_reuse off;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }
}
