# __DOMAIN__ -> http://__UPSTREAM__   (Keycloak)
# Côté Keycloak (variables du conteneur) : KC_PROXY_HEADERS=xforwarded, KC_HTTP_ENABLED=true et KC_HOSTNAME=https://__DOMAIN__
# Généré par scripts/new-site.sh d'après nginx/templates/keycloak.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/errors.conf;

    location / {
        set $upstream __UPSTREAM__;
        include /config/nginx/snippets/proxy.conf;
        include /config/nginx/snippets/timeouts.conf;
        proxy_pass http://$upstream;

        # Les jetons et les cookies de session de Keycloak sont volumineux : tampons d'en-têtes élargis.
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}
