# __DOMAIN__ -> https://__UPSTREAM__   (Plex Media Server, port 32400)
# Plex parle HTTPS avec son propre certificat (non vérifié ici). Lecture vidéo : pas de mise en mémoire tampon,
# connexions longues. Dans Plex, déclarer l'adresse https://__DOMAIN__ (Réglages > Réseau > URL personnalisées).
# Généré par scripts/new-site.sh d'après nginx/templates/plex.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    include /config/nginx/ssl.conf;
    include /config/nginx/snippets/errors.conf;

    client_max_body_size 100m;

    location / {
        set $upstream __UPSTREAM__;
        include /config/nginx/snippets/proxy.conf;
        proxy_pass https://$upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
